services:
  # ─────────────────────────────────────────────
  # PicoClaw Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm picoclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  picoclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: picoclaw-agent
    environment:
      - DINGTALK_WEBHOOK_TOKEN=${DINGTALK_WEBHOOK_TOKEN}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/root/.picoclaw
    entrypoint: ["picoclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # PicoClaw Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  picoclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    profiles:
      - gateway
    container_name: picoclaw-gateway
    restart: on-failure
    environment:
      - DINGTALK_WEBHOOK_TOKEN=${DINGTALK_WEBHOOK_TOKEN}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/root/.picoclaw
    command: ["gateway"]

  # ─────────────────────────────────────────────
  # PicoClaw Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  picoclaw-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    labels:
      dev.orbstack.http-port: 18800
    container_name: picoclaw-launcher
    restart: on-failure
    environment:
      - PICOCLAW_GATEWAY_HOST=0.0.0.0
      - DINGTALK_WEBHOOK_TOKEN=${DINGTALK_WEBHOOK_TOKEN}
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:18800:18800"
      - "127.0.0.1:18790:18790"
    volumes:
      - ./data:/root/.picoclaw
    entrypoint: ["picoclaw-launcher"]
    command: ["-public", "-no-browser"]
